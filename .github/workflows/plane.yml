name: Refresh contribution flight
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/**'
      - '.github/workflows/plane.yml'
permissions:
  contents: write
concurrency:
  group: contribution-flight
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check animation renderer
        run: node --test
      - name: Fetch activity and build flight
        run: node scripts/generate-game.js
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save updated flight
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/plane.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution flight"
            git pull --rebase
            git push
          fi
