<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
<title id="title">Personal cinema symbols</title>
<desc id="desc">An Inception spinning top, Harry Potter glasses and lightning scar, a Mr. Robot mask, The Fountain's tree within a celestial sphere, and Joey's penguin Hugsy with a pizza slice. No visible lettering.</desc>

