  <radialGradient id="pool"><stop stop-color="#8bd5ad" stop-opacity=".06"/><stop offset="1" stop-color="#8bd5ad" stop-opacity="0"/></radialGradient>
  <linearGradient id="gold"><stop stop-color="#b87539"/><stop offset=".5" stop-color="#ffe1a0"/><stop offset="1" stop-color="#c18d4a"/></linearGradient>
</defs>
